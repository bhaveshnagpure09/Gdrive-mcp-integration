# Staging environment — full application stack
# Usage: docker compose -f docker-compose.staging.yml up -d --build
#
# Prerequisites:
#   - Ollama must be running on the host at port 11434 with nomic-embed-text pulled
#     (ollama pull nomic-embed-text)
#   - Copy .env.staging.example to .env.staging and fill in secrets

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_password}
      POSTGRES_DB: ${POSTGRES_DB:-ib_job_skill_mapping_staging}
    ports:
      - "5434:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-staging_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-staging_user}:${POSTGRES_PASSWORD:-staging_password}@postgres:5432/${POSTGRES_DB:-ib_job_skill_mapping_staging}
      PYTHONPATH: /app/src
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-staging_user}:${POSTGRES_PASSWORD:-staging_password}@postgres:5432/${POSTGRES_DB:-ib_job_skill_mapping_staging}
      PYTHONPATH: /app/src
      # Ollama runs on host; host.docker.internal resolves on Docker Desktop
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-staging-secret-change-in-prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GDRIVE_CREDENTIALS_PATH: ${GDRIVE_CREDENTIALS_PATH:-/app/credentials.json}
    volumes:
      - ${GDRIVE_CREDENTIALS_PATH:-./credentials.json}:/app/credentials.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_staging_data:
